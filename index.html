*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#35102d;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#6b174c}button{font:inherit}.stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#ffdbed,#7b2f68 75%);display:grid;place-items:center}@property --bb-sing-rz{syntax:"<angle>";inherits:false;initial-value:0deg}@property --bb-sing-y{syntax:"<length>";inherits:false;initial-value:0px}@property --bb-sing-scale{syntax:"<number>";inherits:false;initial-value:1}@property --bb-dance-rz{syntax:"<angle>";inherits:false;initial-value:0deg}@property --bb-dance-x{syntax:"<length>";inherits:false;initial-value:0px}@property --bb-dance-y{syntax:"<length>";inherits:false;initial-value:0px}@property --bb-dance-scale{syntax:"<number>";inherits:false;initial-value:1}.world{touch-action:none;position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate(var(--tx,0px),var(--ty,0px)) translate(var(--bb-dance-x),calc(var(--bb-sing-y) + var(--bb-dance-y))) rotateZ(calc(var(--rz,0deg) + var(--bb-sing-rz) + var(--bb-dance-rz))) scale(var(--zoom,1)) scale(var(--bb-sing-scale)) scale(var(--bb-dance-scale));transition:filter .25s;will-change:transform;filter:saturate(1.05)}.world img{width:100%;height:100%;object-fit:cover;border-radius:22px;box-shadow:0 30px 80px #240019aa;user-select:none;-webkit-user-drag:none}.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px}.hud{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:#fff8;border:1px solid #fff9;border-radius:22px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #4b153c55;max-width:96vw;overflow-x:auto}.hud button,.top button{border:0;background:#fff;color:#a11c68;padding:10px 12px;border-radius:15px;box-shadow:inset 0 0 0 1px #ffb7d9;white-space:nowrap}.hud button:active,.top button:active{transform:scale(.94)}.top{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:18px;background:#fff8;backdrop-filter:blur(10px);z-index:5}.status{position:fixed;right:12px;top:76px;background:#fff9;padding:8px 12px;border-radius:14px;font-size:12px;z-index:5}.pulse{animation:pulse .45s ease}.sing{animation:bb-world-sing .7s ease-in-out infinite alternate}.dance{animation:bb-world-dance .6s ease-in-out infinite alternate}@keyframes pulse{50%{filter:brightness(1.2) saturate(1.25)}}@keyframes bb-world-sing{to{--bb-sing-rz:1deg;--bb-sing-y:-5px;--bb-sing-scale:1.006}}@keyframes bb-world-dance{to{--bb-dance-rz:-1.5deg;--bb-dance-x:-8px;--bb-dance-y:-4px;--bb-dance-scale:1.008}}.heart{position:absolute;font-size:clamp(20px,4vw,54px);animation:float 2.4s ease-out forwards;filter:drop-shadow(0 4px 6px #a12b6c55)}@keyframes float{0%{transform:translateY(40px) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-280px) scale(1.35) rotate(18deg);opacity:0}}.kiss{position:absolute;font-size:clamp(40px,7vw,90px);left:50%;top:45%;animation:kiss 1.4s ease-out forwards}@keyframes kiss{to{transform:translate(160px,-160px) scale(1.8) rotate(15deg);opacity:0}}.spark{position:absolute;font-size:24px;animation:spark 1.2s ease-out forwards}@keyframes spark{to{transform:translate(var(--sx),var(--sy)) rotate(180deg) scale(.2);opacity:0}}#cam{display:none;position:fixed;left:10px;bottom:80px;width:120px;border-radius:16px;transform:scaleX(-1);opacity:.7}.meter{height:5px;width:80px;background:#ffd3e6;border-radius:8px;overflow:hidden;display:inline-block;vertical-align:middle}.meter i{display:block;height:100%;width:0;background:#e52f8a}.hint{position:fixed;left:12px;top:76px;background:#fff9;padding:8px 12px;border-radius:14px;font-size:12px;max-width:210px;z-index:5}@media(max-width:700px){.world{width:100vw;aspect-ratio:3/2}.hint{display:none}.status{top:auto;bottom:76px}.top button{padding:8px}.hud button{padding:9px 10px}}
.tracking{position:fixed;right:12px;top:112px;background:#fff9;padding:7px 10px;border-radius:12px;font-size:11px;z-index:5}.tracking.live{box-shadow:0 0 0 2px #7ee6a8 inset}@media(prefers-reduced-motion:reduce){.world,.pulse,.sing,.dance,.heart,.kiss,.spark{animation:none!important}.world{transition:none}}</style></head><body><main class="stage"><div class="world" id="world"><img src="ashley-studio.png" alt="Ashley Studio"><div class="fx" id="fx"></div></div></main><video id="cam" autoplay playsinline muted></video><div class="top"><button id="motion">📱 Motion</button><button id="camera">📷 Camera</button><button id="mic">🎤 Sing</button><button id="reset">↺ Reset</button></div><div class="hint">Drag/touch to move Ashley. On iPhone tap <b>Motion</b> and <b>Sing</b> for tilt + voice-reactive performance.</div><div class="status" id="status">✨ Ready · Voice <span class="meter"><i id="level"></i></span></div><div class="tracking" id="tracking">👀 Face tracking ready</div><nav class="hud"><button data-act="wave">👋 Wave</button><button data-act="heart">🫶 Heart</button><button data-act="kiss">💋 Mwah</button><button data-act="sing">🎵 Sing</button><button data-act="dance">✨ Dance</button><button data-act="shy">🌸 Shy</button><button data-act="love">💗 Love Overload</button><button data-act="confetti">🎉 Finale</button></nav><script src="rig/bellabunny-avatar-profile.js"></script><script src="rig/bellabunny-parameter-engine.js"></script><script src="rig/bellabunny-face-tracker.js"></script><script src="rig/bellabunny-animation-engine.js"></script><script src="rig/bellabunny-expression-mixer.js"></script><script src="rig/bellabunny-tracking-calibration.js"></script><script src="rig/bellabunny-audio.js"></script><script src="rig/bellabunny-layer-loader.js"></script><script src="rig/bellabunny-registration.js"></script><script src="rig/bellabunny-art-audit.js"></script><script src="rig/bellabunny-mouth-controller.js"></script><script src="rig/bellabunny-autoblink.js"></script><script src="rig/bellabunny-health.js"></script><script>
const w=document.querySelector('#world'),fx=document.querySelector('#fx'),status=document.querySelector('#status'),level=document.querySelector('#level'),cam=document.querySelector('#cam');let x=0,y=0,z=0,faceX=0,faceY=0,faceZ=0,dragPointer=null,micOn=false,micPending=false,meterRaf=0,lastVoiceHeart=-Infinity;const VOICE_HEART_COOLDOWN_MS=700;
function pose(nx,ny,nz=0){nx=Number.isFinite(nx)?nx:0;ny=Number.isFinite(ny)?ny:0;nz=Number.isFinite(nz)?nz:0;if(!Number.isFinite(x))x=0;if(!Number.isFinite(y))y=0;if(!Number.isFinite(z))z=0;x+=(nx-x)*.18;y+=(ny-y)*.18;z+=(nz-z)*.18;w.style.setProperty('--ry',`${x*7}deg`);w.style.setProperty('--rx',`${-y*5}deg`);w.style.setProperty('--rz',`${z*10}deg`);w.style.setProperty('--tx',`${x*10}px`);w.style.setProperty('--ty',`${y*7}px`)}
addEventListener('bellabunny:head',e=>{if(window.BellabunnyLayers?.state.ready)return;const d=e.detail||{};faceX=Number.isFinite(d.x)?d.x:0;faceY=Number.isFinite(d.y)?d.y:0;faceZ=Number.isFinite(d.z)?d.z:0;if(motionOn)pose(x,y,faceZ);else pose(faceX,faceY,faceZ)});
function endDrag(e){if(e.pointerId!==dragPointer)return;if(w.hasPointerCapture?.(e.pointerId))w.releasePointerCapture(e.pointerId);dragPointer=null}w.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;dragPointer=e.pointerId;w.setPointerCapture?.(e.pointerId);e.preventDefault()});w.addEventListener('pointermove',e=>{if(e.pointerId!==dragPointer)return;pose((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2)});w.addEventListener('pointerup',endDrag);w.addEventListener('pointercancel',endDrag);w.addEventListener('lostpointercapture',e=>{if(e.pointerId===dragPointer)dragPointer=null});
let motionOn=false,motionPending=false,motionHandler=null,motionRequest=0;
const motionButton=document.querySelector('#motion');motionButton.setAttribute('aria-pressed','false');motionButton.setAttribute('aria-busy','false');
function stopMotion(updateStatus=true){motionRequest++;motionPending=false;if(motionHandler)removeEventListener('deviceorientation',motionHandler);motionHandler=null;motionOn=false;motionButton.setAttribute('aria-pressed','false');motionButton.setAttribute('aria-busy','false');if(updateStatus)renderStatus()}
motionButton.onclick=async()=>{if(motionPending)return;if(motionOn){stopMotion();pose(cameraStream?faceX:0,cameraStream?faceY:0,cameraStream?faceZ:0);return}const request=++motionRequest;motionPending=true;motionButton.setAttribute('aria-busy','true');try{let permission='granted';if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')permission=await DeviceOrientationEvent.requestPermission();if(request!==motionRequest||document.hidden)throw new DOMException('Motion start cancelled','AbortError');if(permission!=='granted')throw new Error('Motion permission denied');motionHandler=e=>{const gamma=Number.isFinite(e.gamma)?e.gamma:0,beta=Number.isFinite(e.beta)?e.beta:45;pose(Math.max(-1,Math.min(1,gamma/30)),Math.max(-1,Math.min(1,(beta-45)/40)),cameraStream?faceZ:0)};addEventListener('deviceorientation',motionHandler,{passive:true});motionOn=true;motionButton.setAttribute('aria-pressed','true');renderStatus()}catch(e){stopMotion(false);if(e?.name!=='AbortError'){renderStatus('Touch mode');console.warn(e)}}finally{if(request===motionRequest){motionPending=false;motionButton.setAttribute('aria-busy','false')}}};
let cameraStream=null,cameraPending=false,cameraRequest=0;
function renderStatus(message=''){const live=[];if(cameraStream)live.push('📷 Face');if(motionOn)live.push('📱 Motion');if(micOn)live.push('🎤 Mic');status.firstChild.textContent=`${message?message+' · ':''}${live.length?live.join(' + ')+' LIVE':'✨ Ready'} · Voice `}
const cameraButton=document.querySelector('#camera');cameraButton.setAttribute('aria-pressed','false');cameraButton.setAttribute('aria-busy','false');
const TRACKER_START_TIMEOUT_MS=20000;
function withTimeout(task,ms=TRACKER_START_TIMEOUT_MS){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new DOMException('Face tracker setup timed out','TimeoutError')),ms);Promise.resolve(task).then(value=>{clearTimeout(timer);resolve(value)},error=>{clearTimeout(timer);reject(error)})})}
function stopCamera(updateStatus=true){cameraRequest++;cameraPending=false;const stream=cameraStream;cameraStream=null;faceX=faceY=faceZ=0;cameraButton.setAttribute('aria-pressed','false');cameraButton.setAttribute('aria-busy','false');window.BellabunnyFaceTracker?.stop();stream?.getTracks().forEach(t=>t.stop());cam.pause?.();cam.srcObject=null;cam.style.display='none';tracking.textContent='👀 Face tracking ready';tracking.classList.remove('live');if(updateStatus)renderStatus()}
cameraButton.onclick=async()=>{if(cameraPending)return;if(cameraStream){stopCamera();return}const request=++cameraRequest;cameraPending=true;cameraButton.setAttribute('aria-busy','true');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}},audio:false});if(request!==cameraRequest||document.hidden){stream.getTracks().forEach(t=>t.stop());return}cameraStream=stream;cameraButton.setAttribute('aria-pressed','true');const handleCameraEnded=()=>{if(stream!==cameraStream)return;stopCamera(false);renderStatus('Camera disconnected')};stream.addEventListener?.('inactive',handleCameraEnded,{once:true});stream.getVideoTracks().forEach(track=>track.addEventListener?.('ended',handleCameraEnded,{once:true}));cam.srcObject=stream;cam.style.display='block';await cam.play();const trackerStarted=await withTimeout(window.BellabunnyFaceTracker.start(cam,(ok)=>{tracking.textContent=ok?'👀 Face tracking LIVE':'👀 Looking for face…';tracking.classList.toggle('live',ok)}));if(request!==cameraRequest||document.hidden||!trackerStarted){if(stream===cameraStream)stopCamera(false);else stream.getTracks().forEach(t=>t.stop());return}renderStatus()}catch(e){stopCamera(false);if(e?.name==='TimeoutError'){renderStatus('Face tracking timed out');console.warn(e)}else if(e?.name!=='AbortError'){renderStatus('Camera blocked');console.warn(e)}}finally{if(request===cameraRequest){cameraPending=false;cameraButton.setAttribute('aria-busy','false')}}};
const micButton=document.querySelector('#mic');micButton.setAttribute('aria-pressed','false');micButton.setAttribute('aria-busy','false');
function resetMicPerformance(){cancelAnimationFrame(meterRaf);meterRaf=0;lastVoiceHeart=-Infinity;level.style.width='0';w.style.setProperty('--zoom',1);w.classList.remove('sing')}
async function toggleMic(){if(micPending)return;if(micOn){micOn=false;micButton.setAttribute('aria-pressed','false');BellabunnyVoice.stop();resetMicPerformance();renderStatus();return}micPending=true;micButton.setAttribute('aria-busy','true');try{await BellabunnyVoice.start();micOn=true;micButton.setAttribute('aria-pressed','true');w.classList.add('sing');renderStatus();tick()}catch(e){BellabunnyVoice.stop();micOn=false;micButton.setAttribute('aria-pressed','false');resetMicPerformance();if(e?.name!=='AbortError'){renderStatus('Mic blocked');console.warn(e)}else renderStatus()}finally{micPending=false;micButton.setAttribute('aria-busy','false')}}micButton.onclick=toggleMic;
addEventListener('bellabunny:voice',e=>{if(e.detail?.active||!micOn)return;micOn=false;micPending=false;micButton.setAttribute('aria-pressed','false');micButton.setAttribute('aria-busy','false');resetMicPerformance();renderStatus(e.detail?.reason==='stream-ended'?'Microphone disconnected':'')});
function tick(now=performance.now()){if(!micOn)return;const v=BellabunnyVoice.level;level.style.width=(v*100)+'%';w.style.setProperty('--zoom',1+v*.012);if(v>.22&&now-lastVoiceHeart>=VOICE_HEART_COOLDOWN_MS){lastVoiceHeart=now;heart()}meterRaf=requestAnimationFrame(tick)}
const actionTimers=new Set();
function later(fn,delay){const timer=setTimeout(()=>{actionTimers.delete(timer);fn()},delay);actionTimers.add(timer);return timer}
function clearActionTimers(){actionTimers.forEach(clearTimeout);actionTimers.clear()}
function stopLiveInputs(){stopMotion(false);stopCamera(false);window.BellabunnyVoice?.stop();micOn=false;micPending=false;micButton.setAttribute('aria-pressed','false');micButton.setAttribute('aria-busy','false');resetMicPerformance();clearActionTimers();fx.innerHTML='';renderStatus()}
addEventListener('pagehide',stopLiveInputs);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLiveInputs()});
document.querySelector('#reset').onclick=()=>{BellabunnyCalibration?.calibrate();BellabunnyExpressions?.set('neutral');clearActionTimers();pose(0,0);w.style.setProperty('--zoom',1);w.style.filter='';w.className='world';if(micOn)w.classList.add('sing');fx.innerHTML=''};
function heart(){let h=document.createElement('b');h.className='heart';h.textContent=['💗','💕','💖','🍓','✨'][Math.floor(Math.random()*5)];h.style.left=(15+Math.random()*70)+'%';h.style.top=(65+Math.random()*20)+'%';fx.append(h);later(()=>h.remove(),2500)}
function confetti(){for(let i=0;i<38;i++){let s=document.createElement('i');s.className='spark';s.textContent=['✨','💗','🎀','🍓','🌸'][i%5];s.style.left='50%';s.style.top='48%';s.style.setProperty('--sx',(Math.random()*700-350)+'px');s.style.setProperty('--sy',(Math.random()*500-250)+'px');fx.append(s);later(()=>s.remove(),1300)}}
function act(a){w.classList.remove('pulse');void w.offsetWidth;w.classList.add('pulse');if(a==='heart'){for(let i=0;i<10;i++)later(heart,i*100)}if(a==='kiss'){let k=document.createElement('b');k.className='kiss';k.textContent='💋';fx.append(k);later(()=>k.remove(),1500)}if(a==='dance'){w.classList.toggle('dance')}if(a==='sing')toggleMic();if(a==='love'){for(let i=0;i<30;i++)later(heart,i*55)}if(a==='confetti')confetti();if(a==='shy'){w.style.filter='saturate(1.25) sepia(.08) hue-rotate(-8deg)';later(()=>w.style.filter='',900)}if(a==='wave'){pose(.5,-.1);later(()=>pose(-.3,.05),250);later(()=>pose(0,0),550)}}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));addEventListener('bellabunny:layers',e=>{const d=e.detail;tracking.textContent=d.ready?`🎀 Rig layers ${d.loaded}/${d.total}`:`🎨 Bellabunny reference active · ${d.loaded}/${d.total} rig layers`;});addEventListener('bellabunny:health',e=>{console.table(e.detail.checks)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});

// Face tracking is handled by BellabunnyFaceTracker (single source of truth).\n</script><link rel="stylesheet" href="rig/ashley-rig.css"><div style="display:none" id="rigMount"></div><script>fetch('rig/ashley-rig.html').then(r=>r.text()).then(x=>{rigMount.innerHTML=x;document.querySelector('#world')?.append(document.querySelector('[data-ashley-rig]'));const s=document.createElement('script');s.src='rig/ashley-rig.js';s.onload=()=>{const b=document.createElement('script');b.src='rig/ashley-rig-bridge.js';b.onload=()=>window.BellabunnyLayers?.load();document.body.append(b)};document.body.append(s)}).catch(console.warn)</script></body></html>
