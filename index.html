<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff7fbd"><title>Ashley Studio — Frankenstein VTuber</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#35102d;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#6b174c}button{font:inherit}.stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#ffdbed,#7b2f68 75%);display:grid;place-items:center}.world{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate(var(--tx,0px),var(--ty,0px)) scale(var(--zoom,1));transition:filter .25s;will-change:transform;filter:saturate(1.05)}.world img{width:100%;height:100%;object-fit:cover;border-radius:22px;box-shadow:0 30px 80px #240019aa;user-select:none;-webkit-user-drag:none}.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px}.hud{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:#fff8;border:1px solid #fff9;border-radius:22px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #4b153c55;max-width:96vw;overflow-x:auto}.hud button,.top button{border:0;background:#fff;color:#a11c68;padding:10px 12px;border-radius:15px;box-shadow:inset 0 0 0 1px #ffb7d9;white-space:nowrap}.hud button:active,.top button:active{transform:scale(.94)}.top{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:18px;background:#fff8;backdrop-filter:blur(10px);z-index:5}.status{position:fixed;right:12px;top:76px;background:#fff9;padding:8px 12px;border-radius:14px;font-size:12px;z-index:5}.pulse{animation:pulse .45s ease}.sing{animation:sing .7s ease-in-out infinite alternate}.dance{animation:dance .6s ease-in-out infinite alternate}@keyframes pulse{50%{filter:brightness(1.2) saturate(1.25)}}@keyframes sing{to{transform:perspective(900px) rotateZ(1deg) translateY(-5px) scale(1.006)}}@keyframes dance{to{transform:perspective(900px) rotateZ(-1.5deg) translateX(-8px) translateY(-4px) scale(1.008)}}.heart{position:absolute;font-size:clamp(20px,4vw,54px);animation:float 2.4s ease-out forwards;filter:drop-shadow(0 4px 6px #a12b6c55)}@keyframes float{0%{transform:translateY(40px) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-280px) scale(1.35) rotate(18deg);opacity:0}}.kiss{position:absolute;font-size:clamp(40px,7vw,90px);left:50%;top:45%;animation:kiss 1.4s ease-out forwards}@keyframes kiss{to{transform:translate(160px,-160px) scale(1.8) rotate(15deg);opacity:0}}.spark{position:absolute;font-size:24px;animation:spark 1.2s ease-out forwards}@keyframes spark{to{transform:translate(var(--sx),var(--sy)) rotate(180deg) scale(.2);opacity:0}}#cam{display:none;position:fixed;left:10px;bottom:80px;width:120px;border-radius:16px;transform:scaleX(-1);opacity:.7}.meter{height:5px;width:80px;background:#ffd3e6;border-radius:8px;overflow:hidden;display:inline-block;vertical-align:middle}.meter i{display:block;height:100%;width:0;background:#e52f8a}.hint{position:fixed;left:12px;top:76px;background:#fff9;padding:8px 12px;border-radius:14px;font-size:12px;max-width:210px;z-index:5}@media(max-width:700px){.world{width:100vw;aspect-ratio:3/2}.hint{display:none}.status{top:auto;bottom:76px}.top button{padding:8px}.hud button{padding:9px 10px}}
.tracking{position:fixed;right:12px;top:112px;background:#fff9;padding:7px 10px;border-radius:12px;font-size:11px;z-index:5}.tracking.live{box-shadow:0 0 0 2px #7ee6a8 inset}</style></head><body><main class="stage"><div class="world" id="world"><img src="ashley-studio.png" alt="Ashley Studio"><div class="fx" id="fx"></div></div></main><video id="cam" autoplay playsinline muted></video><div class="top"><button id="motion">📱 Motion</button><button id="camera">📷 Camera</button><button id="mic">🎤 Sing</button><button id="reset">↺ Reset</button></div><div class="hint">Drag/touch to move Ashley. On iPhone tap <b>Motion</b> and <b>Sing</b> for tilt + voice-reactive performance.</div><div class="status" id="status">✨ Ready · Voice <span class="meter"><i id="level"></i></span></div><div class="tracking" id="tracking">👀 Face tracking ready</div><nav class="hud"><button data-act="wave">👋 Wave</button><button data-act="heart">🫶 Heart</button><button data-act="kiss">💋 Mwah</button><button data-act="sing">🎵 Sing</button><button data-act="dance">✨ Dance</button><button data-act="shy">🌸 Shy</button><button data-act="love">💗 Love Overload</button><button data-act="confetti">🎉 Finale</button></nav><script src="rig/bellabunny-parameter-engine.js"></script><script src="rig/bellabunny-face-tracker.js"></script><script>
const w=document.querySelector('#world'),fx=document.querySelector('#fx'),status=document.querySelector('#status'),level=document.querySelector('#level'),cam=document.querySelector('#cam');let x=0,y=0,drag=false,micOn=false,audioCtx,analyser,data,raf;
function pose(nx,ny){x+=(nx-x)*.18;y+=(ny-y)*.18;w.style.setProperty('--ry',`${x*7}deg`);w.style.setProperty('--rx',`${-y*5}deg`);w.style.setProperty('--tx',`${x*10}px`);w.style.setProperty('--ty',`${y*7}px`)}
addEventListener('pointerdown',e=>{drag=true});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;pose((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2)});
document.querySelector('#motion').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')await DeviceOrientationEvent.requestPermission();addEventListener('deviceorientation',e=>pose(Math.max(-1,Math.min(1,(e.gamma||0)/30)),Math.max(-1,Math.min(1,(e.beta-45)/40))));status.firstChild.textContent='📱 Motion live · Voice ';}catch(e){status.firstChild.textContent='Touch mode · Voice '}};
document.querySelector('#camera').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});cam.srcObject=s;cam.style.display='block';status.firstChild.textContent='📷 Camera preview · Voice ';}catch(e){status.firstChild.textContent='Camera blocked · Voice '}};
document.querySelector('#mic').onclick=async()=>{if(micOn){micOn=false;audioCtx?.close();level.style.width='0';w.classList.remove('sing');return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new AudioContext();let src=audioCtx.createMediaStreamSource(s);analyser=audioCtx.createAnalyser();analyser.fftSize=256;data=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);micOn=true;w.classList.add('sing');tick();}catch(e){status.firstChild.textContent='Mic blocked · Voice '}};
function tick(){if(!micOn)return;analyser.getByteFrequencyData(data);let v=data.reduce((a,b)=>a+b,0)/data.length/255;level.style.width=(v*100)+'%';w.style.setProperty('--zoom',1+v*.012);if(v>.22&&Math.random()>.75)heart();raf=requestAnimationFrame(tick)}
document.querySelector('#reset').onclick=()=>{pose(0,0);w.style.setProperty('--zoom',1);w.className='world';fx.innerHTML=''};
function heart(){let h=document.createElement('b');h.className='heart';h.textContent=['💗','💕','💖','🍓','✨'][Math.floor(Math.random()*5)];h.style.left=(15+Math.random()*70)+'%';h.style.top=(65+Math.random()*20)+'%';fx.append(h);setTimeout(()=>h.remove(),2500)}
function confetti(){for(let i=0;i<38;i++){let s=document.createElement('i');s.className='spark';s.textContent=['✨','💗','🎀','🍓','🌸'][i%5];s.style.left='50%';s.style.top='48%';s.style.setProperty('--sx',(Math.random()*700-350)+'px');s.style.setProperty('--sy',(Math.random()*500-250)+'px');fx.append(s);setTimeout(()=>s.remove(),1300)}}
function act(a){w.classList.remove('pulse');void w.offsetWidth;w.classList.add('pulse');if(a==='heart'){for(let i=0;i<10;i++)setTimeout(heart,i*100)}if(a==='kiss'){let k=document.createElement('b');k.className='kiss';k.textContent='💋';fx.append(k);setTimeout(()=>k.remove(),1500)}if(a==='dance'){w.classList.toggle('dance')}if(a==='sing'){w.classList.toggle('sing')}if(a==='love'){for(let i=0;i<30;i++)setTimeout(heart,i*55)}if(a==='confetti')confetti();if(a==='shy'){w.style.filter='saturate(1.25) sepia(.08) hue-rotate(-8deg)';setTimeout(()=>w.style.filter='',900)}if(a==='wave'){pose(.5,-.1);setTimeout(()=>pose(-.3,.05),250);setTimeout(()=>pose(0,0),550)}}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// MediaPipe Face Landmarker integration: camera drives Ashley's head pose.
// Keeps touch + phone motion as fallbacks and runs only after Camera is enabled.
(async()=>{
 const tracking=document.querySelector('#tracking');
 try{
   const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');
   const {FaceLandmarker,FilesetResolver}=vision;
   const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
   const face=await FaceLandmarker.createFromOptions(fileset,{
     baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},
     runningMode:'VIDEO',numFaces:1,
     outputFaceBlendshapes:true,
     outputFacialTransformationMatrixes:true,
     minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5
   });
   let last=-1;
   async function track(){
     if(cam.srcObject && cam.readyState>=2 && cam.currentTime!==last){
       last=cam.currentTime;
       const r=face.detectForVideo(cam,performance.now());
       const lm=r.faceLandmarks?.[0];
       if(lm){
         const nose=lm[1], left=lm[33], right=lm[263];
         const midX=(left.x+right.x)/2, eyeY=(left.y+right.y)/2;
         pose(Math.max(-1,Math.min(1,(nose.x-midX)*8)),Math.max(-1,Math.min(1,(nose.y-eyeY-.10)*6)));
         tracking.textContent='👀 Face tracking LIVE';
         tracking.classList.add('live');
         const shapes=r.faceBlendshapes?.[0]?.categories||[];
         const score=n=>shapes.find(s=>s.categoryName===n)?.score||0;
         const blink=Math.max(score('eyeBlinkLeft'),score('eyeBlinkRight'));
         const jaw=score('jawOpen');
         if(window.BellabunnyRig) BellabunnyRig.batch({headX:Math.max(-1,Math.min(1,(nose.x-midX)*8)),headY:Math.max(-1,Math.min(1,(nose.y-eyeY-.10)*6)),...BellabunnyRig.fromBlendshapes(shapes)});
         w.style.filter=blink>.55?'brightness(.94) saturate(1.08)':'';
         w.style.setProperty('--zoom',1+Math.min(.012,jaw*.012));
         if(jaw>.35) w.classList.add('sing'); else if(!micOn) w.classList.remove('sing');
       }else{
         tracking.textContent='👀 Looking for face…';
         tracking.classList.remove('live');
       }
     }
     requestAnimationFrame(track);
   }
   track();
 }catch(err){
   tracking.textContent='👆 Touch / Motion tracking active';
   console.warn('MediaPipe unavailable; fallbacks remain active.',err);
 }
})();
</script><link rel="stylesheet" href="rig/ashley-rig.css"><div style="display:none" id="rigMount"></div><script>fetch('rig/ashley-rig.html').then(r=>r.text()).then(x=>{rigMount.innerHTML=x;document.querySelector('#world')?.append(document.querySelector('[data-ashley-rig]'));const s=document.createElement('script');s.src='rig/ashley-rig.js';document.body.append(s);const b=document.createElement('script');b.src='rig/ashley-rig-bridge.js';document.body.append(b)}).catch(console.warn)</script></body></html>
