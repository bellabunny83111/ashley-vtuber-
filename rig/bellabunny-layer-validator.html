<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bellabunny Layer Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#fff2f8;color:#7b315d;font:14px system-ui}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.panel{padding:18px;background:#fff;border-right:1px solid #ffd0e4;overflow:auto}.stage{display:grid;place-items:center;background:radial-gradient(circle,#fff,#ffd8e9);overflow:hidden}.canvas{position:relative;width:min(75vw,75vh);aspect-ratio:1;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.cross:before,.cross:after{content:"";position:absolute;background:#ff4d9a88;z-index:999}.cross:before{left:50%;top:0;width:1px;height:100%}.cross:after{top:50%;left:0;height:1px;width:100%}button{border:0;border-radius:12px;padding:9px;background:#ff8fbd;color:white;margin:3px}.row{display:flex;gap:5px;align-items:center;margin:6px 0}.warn{padding:10px;background:#fff0b8;border-radius:12px}@media(max-width:700px){.app{grid-template-columns:1fr}.panel{max-height:42vh;border-right:0}.stage{min-height:58vh}}</style><div class=app><aside class=panel><h2>🎀 Bellabunny Layer Lab</h2><p class=warn>This validator intentionally reports missing PNGs instead of hiding them.</p><button id=all>All</button><button id=none>None</button><button id=cross>Crosshair</button><button id=ref>Reference</button><label class="row">Reference opacity <input id=opacity type=range min=0 max=1 step=.05 value=.5></label><div id=list></div><pre id=status></pre></aside><main class=stage><div class="canvas cross" id=canvas><img id=reference src="../ashley-studio.png" style="z-index:998;opacity:.5;pointer-events:none"></div></main></div><script>const root="../assets/ashley/layers/";let manifest;async function boot(){manifest=await fetch(root+"manifest.json").then(r=>r.json());const files=manifest.layers.map(x=>typeof x==="string"?x:x.file);let loaded=0,missing=0;for(const f of files){const row=document.createElement("label");row.className="row";const cb=document.createElement("input");cb.type="checkbox";cb.checked=true;const span=document.createElement("span");span.textContent=f;const img=new Image;img.src=root+f;img.dataset.file=f;img.onload=()=>{loaded++;update()};img.onerror=()=>{missing++;span.textContent+=" ⚠ missing";span.style.opacity=.55;img.remove();update()};cb.oninput=()=>img.style.display=cb.checked?"":"none";row.append(cb,span);list.append(row);canvas.append(img)}function update(){status.textContent="Loaded: "+loaded+"\nMissing: "+missing+"\nExpected: "+files.length}update()}all.onclick=()=>document.querySelectorAll('input').forEach(x=>(x.checked=true,x.dispatchEvent(new Event('input'))));none.onclick=()=>document.querySelectorAll('input').forEach(x=>(x.checked=false,x.dispatchEvent(new Event('input'))));cross.onclick=()=>canvas.classList.toggle('cross');ref.onclick=()=>reference.hidden=!reference.hidden;opacity.oninput=()=>reference.style.opacity=opacity.value;boot()</script>
