<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bellabunny Registration Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff2f8;color:#7b315d;font:14px system-ui}.app{display:grid;grid-template-columns:300px 1fr;min-height:100dvh}.panel{padding:16px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#fff;border-right:1px solid #ffd0e4;overflow:auto}.stage{display:grid;place-items:center;background:radial-gradient(circle,#fff,#ffd8e9);overflow:hidden;touch-action:none}.canvas{position:relative;width:min(72vw,78vh);aspect-ratio:1;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.layer{transform:translate(var(--x,0px),var(--y,0px)) scale(var(--s,1)) rotate(var(--r,0deg));transform-origin:50% 50%}.cross:before,.cross:after{content:"";position:absolute;background:#ff4d9a88;z-index:999}.cross:before{left:50%;top:0;width:1px;height:100%}.cross:after{top:50%;left:0;height:1px;width:100%}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px;background:#ff8fbd;color:white;margin:3px}.row{display:flex;gap:6px;align-items:center;margin:7px 0}.row input[type=number]{width:72px}.warn{padding:10px;background:#fff0b8;border-radius:12px}.controls{padding:10px;background:#fff5fa;border-radius:14px;margin:10px 0}.controls label{display:grid;grid-template-columns:45px 1fr 72px;gap:6px;align-items:center;margin:6px 0}select{max-width:100%;padding:7px}.good{color:#267a48}.bad{color:#a62b55}textarea{width:100%;min-height:110px}@media(max-width:700px){.app{grid-template-columns:1fr}.panel{max-height:48dvh;border-right:0}.stage{min-height:52dvh}.canvas{width:min(94vw,52dvh)}}
</style>
<div class=app><aside class=panel><h2>🎀 Bellabunny Registration Lab</h2><p class=warn>Align real PNG layers against the approved reference. Nothing is marked registered until you explicitly save that layer.</p>
<div class=row><button id=all>All</button><button id=none>None</button><button id=cross>Crosshair</button><button id=ref>Reference</button></div>
<label class=row>Reference opacity <input id=opacity type=range min=0 max=1 step=.05 value=.5></label>
<div class=controls><b>Selected layer</b><br><select id=selected></select>
<label>X <input id=x type=range min=-1024 max=1024 step=1 value=0><input id=xn type=number step=1 value=0></label>
<label>Y <input id=y type=range min=-1024 max=1024 step=1 value=0><input id=yn type=number step=1 value=0></label>
<label>Scale <input id=scale type=range min=.05 max=4 step=.01 value=1><input id=scalen type=number min=.01 step=.01 value=1></label>
<label>Rotate <input id=rotate type=range min=-180 max=180 step=.5 value=0><input id=rotaten type=number step=.5 value=0></label>
<div class=row><button id=save>Save registration</button><button id=reset>Reset layer</button></div><small>Drag the selected layer on the stage for quick X/Y alignment.</small></div>
<div class=row><button id=exportBtn>Export profile</button><button id=importBtn>Import profile</button></div><textarea id=profile placeholder="Registration JSON"></textarea>
<div id=list></div><pre id=status></pre></aside><main class=stage id=stage><div class="canvas cross" id=canvas><img id=reference src="../ashley-studio.png" style="z-index:998;opacity:.5;pointer-events:none"></div></main></div>
<script>
const root="../assets/ashley/layers/",KEY="bellabunny.registration.v2";let manifest,files=[],active=null,reg={};try{reg=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{reg={}}
const slotByFile={"00_back_hair.png":"backHair","01_body_outfit.png":"body","02_neck.png":"neck","03_head_base.png":"head","04_eye_l_open.png":"eyeL","05_eye_r_open.png":"eyeR","06_pupil_l.png":"pupilL","07_pupil_r.png":"pupilR","08_eye_l_closed.png":"eyeLClosed","09_eye_r_closed.png":"eyeRClosed","10_brow_l.png":"browL","11_brow_r.png":"browR","13_front_hair_l.png":"frontHairL","14_front_hair_r.png":"frontHairR","15_curl_l.png":"curlL","16_curl_r.png":"curlR","17_bunny_ear_l.png":"earL","18_bunny_ear_r.png":"earR","19_arm_l.png":"armL","20_arm_r.png":"armR","23_sleeve_l.png":"sleeveL","24_sleeve_r.png":"sleeveR","21_accessories.png":"accessories","22_skirt_front.png":"skirt"};
const norm=v=>({x:Number.isFinite(+v?.x)?+v.x:0,y:Number.isFinite(+v?.y)?+v.y:0,scale:Number.isFinite(+v?.scale)&&+v.scale>0?+v.scale:1,rotate:Number.isFinite(+v?.rotate)?+v.rotate:0});
function slot(f){return slotByFile[f]||(f.startsWith("12_mouth_")?"mouth":null)} function value(f){return norm(reg[slot(f)]||{})}
function paint(f){const img=canvas.querySelector('[data-file="'+CSS.escape(f)+'"]');if(!img)return;const v=value(f);img.style.setProperty("--x",v.x+"px");img.style.setProperty("--y",v.y+"px");img.style.setProperty("--s",v.scale);img.style.setProperty("--r",v.rotate+"deg")}
function sync(){if(!active)return;const v=value(active);[[x,xn,v.x],[y,yn,v.y],[scale,scalen,v.scale],[rotate,rotaten,v.rotate]].forEach(([a,b,n])=>{a.value=n;b.value=n});update()}
function preview(){if(!active)return;const v={x:+x.value,y:+y.value,scale:+scale.value,rotate:+rotate.value},img=canvas.querySelector('[data-file="'+CSS.escape(active)+'"]');if(img){img.style.setProperty("--x",v.x+"px");img.style.setProperty("--y",v.y+"px");img.style.setProperty("--s",v.scale);img.style.setProperty("--r",v.rotate+"deg")}}
function update(){const loaded=canvas.querySelectorAll("img.layer").length,registered=new Set(Object.keys(reg));status.textContent="Loaded: "+loaded+" / "+files.length+"\nRegistered slots: "+registered.size+"\nSelected: "+(active||"none")+"\nSlot: "+(active?slot(active)||"not runtime-mapped":"—");status.className=loaded===files.length?"good":"bad"}
async function boot(){manifest=await fetch(root+"manifest.json",{cache:"no-store"}).then(r=>r.json());files=manifest.layers.map(v=>typeof v==="string"?v:v.file);for(const f of files){const row=document.createElement("label");row.className="row";const cb=document.createElement("input");cb.type="checkbox";cb.checked=true;const span=document.createElement("span");span.textContent=f;const opt=new Option(f,f);selected.add(opt);const img=new Image;img.className="layer";img.dataset.file=f;img.src=root+f+"?lab=7";img.onload=()=>{canvas.append(img);paint(f);update()};img.onerror=()=>{span.textContent+=" ⚠ missing";span.className="bad";update()};cb.oninput=()=>img.style.display=cb.checked?"":"none";row.append(cb,span);list.append(row)}active=files[0];selected.value=active;sync()}
selected.onchange=()=>{active=selected.value;sync()}; all.onclick=()=>document.querySelectorAll("#list input").forEach(e=>{e.checked=true;e.dispatchEvent(new Event("input"))});none.onclick=()=>document.querySelectorAll("#list input").forEach(e=>{e.checked=false;e.dispatchEvent(new Event("input"))});cross.onclick=()=>canvas.classList.toggle("cross");ref.onclick=()=>reference.hidden=!reference.hidden;opacity.oninput=()=>reference.style.opacity=opacity.value;
[[x,xn],[y,yn],[scale,scalen],[rotate,rotaten]].forEach(([a,b])=>{a.oninput=()=>{b.value=a.value;preview()};b.oninput=()=>{a.value=b.value;preview()}});
save.onclick=()=>{const s=slot(active);if(!s)return alert("This file has no runtime slot yet.");reg[s]=norm({x:+x.value,y:+y.value,scale:+scale.value,rotate:+rotate.value});localStorage.setItem(KEY,JSON.stringify(reg));paint(active);update()};
reset.onclick=()=>{const s=slot(active);if(s)delete reg[s];localStorage.setItem(KEY,JSON.stringify(reg));sync();paint(active)};
exportBtn.onclick=()=>profile.value=JSON.stringify(reg,null,2);importBtn.onclick=()=>{try{const raw=JSON.parse(profile.value),clean={};for(const [k,v] of Object.entries(raw))clean[k]=norm(v);reg=clean;localStorage.setItem(KEY,JSON.stringify(reg));files.forEach(paint);sync()}catch(e){alert("Registration JSON is invalid.")}};
let drag=null;stage.addEventListener("pointerdown",e=>{if(!active)return;drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:+x.value,y:+y.value};stage.setPointerCapture(e.pointerId)});stage.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const rect=canvas.getBoundingClientRect(),factor=2048/rect.width;x.value=xn.value=Math.round(drag.x+(e.clientX-drag.sx)*factor);y.value=yn.value=Math.round(drag.y+(e.clientY-drag.sy)*factor);preview()});stage.addEventListener("pointerup",e=>{if(drag?.id===e.pointerId)drag=null});boot();
</script>
